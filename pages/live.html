<!DOCTYPE html>
<html lang="en">
<head>

  <title>Display Card</title>
  <link rel="stylesheet" href="../style/live.css">
  <script src="../js/live.js" defer></script>
</head>
<body>

  <div class="card-container">

    </div>
  </div>
