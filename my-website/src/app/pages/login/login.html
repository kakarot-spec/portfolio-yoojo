<div class="login-wrapper">
  <!-- Back to Home Arrow Button -->
  <a routerLink="/home" class="back-home-btn" title="Back to Home">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    <span>Home</span>
  </a>

  <div class="login-card">
    <div class="avatar-icon">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 20a6 6 0 0 0-12 0" />
        <circle cx="12" cy="10" r="4" />
        <circle cx="12" cy="12" r="10" />
      </svg>
    </div>

    <h2>Welcome Back!</h2>
    <p class="subtitle">Please login to your account</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="input-group">
        <span class="input-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </span>
        <input
          type="text"
          formControlName="username"
          placeholder="Username"
          autocomplete="username"
        />
      </div>

      <div class="input-group">
        <span class="input-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </span>
        <input
          type="password"
          formControlName="password"
          placeholder="Password"
          autocomplete="current-password"
        />
      </div>

      <!-- Displays error if wrong username/password entered -->
      <p *ngIf="errorMessage" class="error-text">{{ errorMessage }}</p>

      <button type="submit" class="btn-login" [disabled]="loginForm.invalid">Login</button>
    </form>

    <!-- Pointing to blank page -->
    <a href="about:blank" target="_blank" class="forgot-password">Forgot password?</a>
  </div>
</div>
