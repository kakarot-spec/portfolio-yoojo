<p>login works!</p>
<div
  class="login-container"
  style="
    max-width: 400px;
    margin: 50px auto;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
  "
>
  <h2>Admin Login</h2>

  <form (ngSubmit)="onSubmit()">
    <div style="margin-bottom: 15px">
      <label>Username:</label><br />
      <input
        type="text"
        [(ngModel)]="username"
        name="username"
        required
        style="width: 100%; padding: 8px; margin-top: 5px"
      />
    </div>

    <div style="margin-bottom: 15px">
      <label>Password:</label><br />
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        style="width: 100%; padding: 8px; margin-top: 5px"
      />
    </div>

    @if (errorMessage) {
      <p style="color: red; font-size: 14px">{{ errorMessage }}</p>
    }

    <button
      type="submit"
      style="
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      "
    >
      Login
    </button>
  </form>
</div>
